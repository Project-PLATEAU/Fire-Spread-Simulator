###################################################################
#		市街地火災シミュレーションVersion2条件設定ファイル
#			平成２０年１１月
###################################################################

###################################################################
#	共通パラメータ設定
###################################################################
[MAIN]
# 処理実行フラグ：0 データコンバータ；1 延焼シミュレーション
exeStep = 1

# ログファイル
LogFile = .\simfire.log

[OUTFLAG]
# 結果出力データフラグ：0 簡易；1 標準；2 詳細；9 テスト用
OutdataFlag = 1

# 開口部情報出力フラグ
OutOpDataFlg = 1

# 着火判定点情報出力フラグ
OutPDataFlg = 1

# 区画情報出力フラグ
OutRoomDataFlg = 1

# 隔壁情報出力フラグ
OutPartDataFlg = 1

# 換気経路情報出力フラグ
OutVentDataFlg = 1

# 気流データ出力フラグ
OutConvectionDataFlg = 0

# KMLファイル出力フラグ
OutKMLFlg = 1

# 出力間隔　（計算ステップの何回ごとに出力するかの間隔）
OutInterval = 1

###################################################################
#	延焼シミュレーションパラメータ設定
###################################################################
[MAP]
InPath  = ./sim_map
OutPath = ./sim_out

# メッシュ構造を使用するかどうかのフラグ
UseMesh = 0

# メッシュデータファイル名
Meshfile = mesh.dat

# 建物データファイル名
Buildfile = builds.dat

# 区画データファイル名
Roomfile = rooms.dat

# 塀柵樹木データファイル名
Hedgefile = 

# 瓦礫データファイル名
Cribfile = 

# 瓦礫下端高さデータファイル名
CribDemfile =

# 計測点データファイル名
CheckPointfile = 

# 火災性状データファイル名
Outfile = out.csv

# 着火データファイル名
Igfile = igout.dat

# 延焼経路データファイル名
Firepathfile = firepath.dat

[FIREBRAND]
# 飛び火計算有無
FirebrandFlg = 1

# 飛び火延焼係数
CoeffFirebrand = 0.001

[Condition]
ConditionPath = ./sim_cond

# 材料データファイル名
Materialfile = stdMATERIALS.CSV

# 面材データファイル名
Partfile = stdPARTS.CSV

# 被災区分定義ファイル名
Hisaifile = stdHISAI.CSV

# 定数データファイル名
Constfile = const.dat

# 気象条件設定ファイル名
Weatherfile = weather.dat

# 気象データベースファイル名
WeatherDBfile =

# 気象データベース参照時間間隔(分)
WeatherDBStepTime = 0

# 出火点データファイル名
Ignitefile = outBreak.dat

# 風向風速分布定義ファイル名
WindDistributionfile = 

# シミュレーション時間（分）
SimTime = 1

# 建物間計算時の計算ステップ時間[sec]
StepTime = 60

[Convection]
# 熱気流計算メッシュサイズ（水平方向）
MeshSize = 5

# 熱気流計算メッシュサイズ（高さ方向）
zMeshSize = 5

# 熱気流データフォルダ名
ConvectionPath = .

# 出力用熱気流メッシュ管理ファイル
ConvMeshfile = 

# 出力用熱気流性状データファイル名
Convectionfile = 
